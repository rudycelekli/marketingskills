name: Marketingskills852 native Node20 main/candidate proof
'on':
  workflow_dispatch: {}
  push:
    branches:
    - proof/marketing852-node20-20261021T0747Z
permissions:
  contents: read
jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source:
        - main
        - candidate
    steps:
    - uses: actions/checkout@v6
      with:
        repository: coreyhaines31/marketingskills
        ref: e85f3cbc2e4a79bf33b2a12e9bdd9087d414735b
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Guard exact sources and run unchanged required CLI suite
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD)\" = \"e85f3cbc2e4a79bf33b2a12e9bdd9087d414735b\" ]\nmkdir -p proof\nprintf \"%s\\n\" \"${ImageOS:-unknown}\" \"${ImageVersion:-unknown}\" > proof/runner-image.txt\nprintf '%s\\n' \"${{ matrix.source }}\" > proof/source.txt\nif [ \"${{ matrix.source }}\" = candidate ]; then\n  printf '%s' '' | base64 --decode | gzip --decompress > /tmp/repair.patch\n  echo '4282e0046e69da0b3fd2cd62984fdf5631d6acd7b2a911331e66461b3135cbfd  /tmp/repair.patch' | sha256sum -c -\n  git apply --index /tmp/repair.patch\nfi\nactual=$(git write-tree)\nexpected='b9ab74b476fc012746ec8f17206857a2b4f2bcc0'\nif [ \"${{ matrix.source }}\" = candidate ]; then expected='d12a3ae310464385241d6f8ad5a16ff4e5fc026a'; fi\n[ \"$actual\" = \"$expected\" ]\nprintf '%s\\n' \"$actual\" > proof/source-tree.txt\ngit diff --cached --check\ngit diff --check\nnode --version > proof/node-version.txt\nuname -a > proof/platform.txt\nfor f in tools/clis/*.js; do node --check \"$f\"; done\nnode --test tests/clis/*.test.cjs tests/assets/*.test.cjs > proof/canonical-tests.log 2>&1\n"
    - name: Post-run unchanged tracked-source guard
      if: always()
      run: 'set -euo pipefail

        git diff --exit-code

        git diff --cached --check

        actual=$(git write-tree)

        [ "$actual" = "$(cat proof/source-tree.txt)" ]

        printf "%s\n" PASS > proof/post-source-guard.txt

        '
    - name: Upload proof even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-${{ matrix.source }}
        path: proof
        if-no-files-found: error
